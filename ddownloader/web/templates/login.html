<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Login - Ddownloader</title>

    <!-- Bootstrap 5 (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ddownloader.css') }}" />

    <!-- System theme (prefers-color-scheme) -> Bootstrap color mode -->
    <script>
      (() => {
        try {
          const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        } catch {
          // If anything goes wrong, fall back to Bootstrap's default (light)
        }
      })();
    </script>
  </head>

  <body class="bg-body-tertiary">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">

          <h1 class="h3 mb-4 text-center">Ddownloader</h1>

          <div class="card">
            <div class="card-body">
              <form action="{{ url_for('auth.login') }}" method="post" novalidate>
                <input type="hidden" name="next" value="{{ next or '' }}" />

                {% if error %}
                  <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
                {% endif %}

                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    value="{{ username or '' }}"
                    autofocus
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Log in
                </button>
              </form>
            </div>
          </div>

        </div>
      </div>
    </main>
  </body>
</html>
