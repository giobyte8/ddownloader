<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}ddownloader{% endblock %}</title>

    <!-- Bootstrap 5 (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    {% block head %}{% endblock %}

    <!-- System theme (prefers-color-scheme) -> Bootstrap color mode -->
    <script>
      (() => {
        try {
          const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        } catch {
          // If anything goes wrong, fall back to Bootstrap's default (light)
        }
      })();
    </script>

    <style>
      /* Shared small improvements for readability */
      .wrap-anywhere { overflow-wrap: anywhere; word-break: break-word; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>

    {% block styles %}{% endblock %}
  </head>

  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/">Ddownloader</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/sources/">
                Sources
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/sources/download_jobs">
                Download Jobs
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}

      <footer class="pt-4 mt-4 border-top text-secondary small">
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-between">
          <div>Ddownloader</div>
        </div>
      </footer>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
